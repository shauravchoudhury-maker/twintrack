<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Twin Track</title>
<meta name="description" content="A 15-week daily math and English plan for two Grade 5 students — 45 minutes a day.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181D" media="(prefers-color-scheme: dark)">
<!-- iPad: launch full-screen from the home screen, without Safari's chrome. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Twin Track">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --ink:#1B2027; --ink-2:#404a56; --ink-3:#6b7784;
  --paper:#FAFAF8; --panel:#FFFFFF; --sunk:#F1F2EE;
  --rule:#CBD8DF; --rule-soft:#E4E8E5;
  --math:#1F6E7B; --math-soft:#E4F0F1;
  --eng:#7A3B52; --eng-soft:#F5E8EC;
  --good:#3E7A4E; --good-soft:#E6F0E7;
  --warn:#B8762E; --warn-soft:#F8EDDF;
  --accent:#1F6E7B;
  --shadow:0 1px 2px rgba(27,32,39,.06),0 8px 20px -12px rgba(27,32,39,.18);
  --r:10px;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono","Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#EAEDE9; --ink-2:#b6bfc7; --ink-3:#8b96a1;
  --paper:#14181D; --panel:#1B2027; --sunk:#232A31;
  --rule:#39444E; --rule-soft:#2A323A;
  --math:#6FC4CE; --math-soft:#1B3439;
  --eng:#DFA0B4; --eng-soft:#35222A;
  --good:#7FC08D; --good-soft:#1E2E22;
  --warn:#E0AC6A; --warn-soft:#33281A;
  --accent:#6FC4CE;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ink:#EAEDE9; --ink-2:#b6bfc7; --ink-3:#8b96a1;
  --paper:#14181D; --panel:#1B2027; --sunk:#232A31;
  --rule:#39444E; --rule-soft:#2A323A;
  --math:#6FC4CE; --math-soft:#1B3439;
  --eng:#DFA0B4; --eng-soft:#35222A;
  --good:#7FC08D; --good-soft:#1E2E22;
  --warn:#E0AC6A; --warn-soft:#33281A;
  --accent:#6FC4CE;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 80px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- masthead ---- */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule-soft)}
.top-in{max-width:820px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.brand .rule-mark{width:20px;height:20px;border:1.5px solid var(--rule);border-radius:3px;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:6px 6px;flex:none}
.kids{display:flex;gap:5px;margin-left:auto}
.kid-btn{border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);padding:5px 13px;border-radius:999px;
  font-weight:600;font-size:14px;transition:.15s}
.kid-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.navs{display:flex;gap:2px;border-top:1px solid var(--rule-soft);max-width:820px;margin:0 auto;padding:0 20px}
.nav{border:0;background:none;color:var(--ink-3);font-weight:600;font-size:14px;padding:9px 12px;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.nav[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

/* ---- shared ---- */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--rule-soft);border-radius:var(--r);padding:18px 20px}
.muted{color:var(--ink-3)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:8px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;
  letter-spacing:.02em}
.pill.math{background:var(--math-soft);color:var(--math)}
.pill.eng{background:var(--eng-soft);color:var(--eng)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* ---- day header ---- */
.dayhead{padding:26px 0 18px;border-bottom:2px solid var(--ink)}
.dayhead h1{font-size:31px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 8px}
.meterbar{height:5px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:14px}
.meterbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.daystat{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;font-size:13.5px;color:var(--ink-3)}
.daystat b{color:var(--ink);font-family:var(--f-mono);font-weight:600}

/* ---- blocks ---- */
.blocks{display:flex;flex-direction:column;gap:0;margin-top:4px}
.block{border-bottom:1px solid var(--rule-soft)}
.block-btn{width:100%;display:flex;align-items:center;gap:14px;padding:15px 4px;background:none;border:0;text-align:left;color:inherit}
.bnum{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;
  font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-3)}
.block.done .bnum{background:var(--good);border-color:var(--good);color:#fff}
.block.active .bnum{border-color:var(--ink);color:var(--ink);border-width:2px}
.btitle{font-weight:600;font-size:16.5px;flex:1;min-width:0}
.btitle small{display:block;font-weight:400;font-size:13px;color:var(--ink-3);margin-top:1px}
.bmin{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3);flex:none}
.body{padding:2px 0 22px 40px}
.block:not(.active) .body{display:none}
@media(max-width:560px){ .body{padding-left:6px} }

/* ---- work ---- */
.example{background:var(--sunk);border-left:3px solid var(--math);border-radius:0 8px 8px 0;padding:13px 16px;margin-bottom:16px}
.example.eng{border-left-color:var(--eng)}
.example h4{margin:0 0 6px;font-family:var(--f-body);font-size:13px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink-3)}
.example p{margin:5px 0}
.q{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px dashed var(--rule-soft)}
.q:last-of-type{border-bottom:0}
.qn{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);width:20px;flex:none;padding-top:9px}
.qtext{flex:1;min-width:0;padding-top:6px}
.qtext .qmath{font-family:var(--f-mono);font-size:16px}
input[type=text]{font-family:var(--f-mono);font-size:15px;width:110px;padding:7px 9px;border:1px solid var(--rule);
  border-radius:7px;background:var(--panel);color:var(--ink);flex:none}
input[type=text].ok{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
input[type=text].no{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:600}
.mark{width:18px;flex:none;font-weight:700;padding-top:8px;font-size:15px}
textarea{width:100%;font-family:var(--f-body);font-size:15px;line-height:1.6;padding:11px 13px;border:1px solid var(--rule);
  border-radius:8px;background:var(--panel);color:var(--ink);resize:vertical;min-height:96px}
.passage{font-family:var(--f-display);font-size:16.5px;line-height:1.72;max-width:62ch}
.passage p{margin:0 0 13px}
.passage h4{font-family:var(--f-display);font-size:19px;margin:0 0 4px}
.src{font-size:12.5px;color:var(--ink-3);margin-bottom:14px;font-style:italic}
.roots{display:grid;gap:10px;margin-bottom:14px}
.root{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;padding:11px 14px;background:var(--sunk);border-radius:8px}
.root b{font-family:var(--f-mono);font-size:15.5px;color:var(--eng)}
.root .mean{font-weight:600}
.root .ex{grid-column:2;font-size:13.5px;color:var(--ink-3)}
.timer{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:11px 14px;background:var(--sunk);border-radius:8px}
.tval{font-family:var(--f-mono);font-size:25px;font-weight:600;letter-spacing:-.02em;min-width:78px}
.ttarget{font-size:13px;color:var(--ink-3);flex:1;min-width:120px}
.result{margin-top:14px;padding:12px 15px;border-radius:8px;font-size:14.5px;display:none}
.result.show{display:block}
.result.pass{background:var(--good-soft);color:var(--good)}
.result.part{background:var(--warn-soft);color:var(--warn)}

/* ---- progress / plan ---- */
.grid15{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.wk{border:1px solid var(--rule-soft);border-radius:8px;padding:11px 12px;background:var(--panel)}
.wk.done{border-color:var(--good);background:var(--good-soft)}
.wk.now{border-color:var(--ink);border-width:2px;padding:10px 11px}
.wk .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);font-weight:600}
.wk .t{font-weight:600;font-size:13.5px;line-height:1.3;margin-top:3px}
.wk .s{font-size:11.5px;color:var(--ink-3);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  padding:0 10px 7px 0;font-weight:700;border-bottom:1px solid var(--rule)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
.spark{display:flex;align-items:flex-end;gap:2px;height:30px}
.spark i{width:5px;background:var(--accent);border-radius:1px;min-height:2px;display:block}
.setup{border:2px solid var(--ink);border-radius:var(--r);padding:22px;background:var(--panel)}
.setup input[type=text]{width:100%;font-family:var(--f-body);font-size:16px}
.sync{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex:none}
.dot.local{background:var(--warn)}
.hidden{display:none!important}
.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:560px){.split{grid-template-columns:1fr}}
.note{font-size:13.5px;color:var(--ink-3);border-left:2px solid var(--rule);padding-left:12px;margin:14px 0}
/* Home-screen launch: keep content clear of the iPad status bar / home indicator. */
body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{padding-top:env(safe-area-inset-top)}
/* Touch targets on iPad, and stop iOS zooming when an input is focused. */
input[type=text],textarea{font-size:16px}
.btn,.kid-btn,.nav{min-height:38px}
.block-btn{min-height:52px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="rule-mark"></span>Twin Track</div>
    <div class="kids" id="kids"></div>
  </div>
  <nav class="navs">
    <button class="nav" data-view="today" aria-current="page">Today</button>
    <button class="nav" data-view="progress">Progress</button>
    <button class="nav" data-view="plan">Plan</button>
  </nav>
</header>

<div class="wrap">
  <div id="setup" class="hidden" style="margin-top:26px">
    <div class="setup">
      <div class="eyebrow">First run</div>
      <h2 style="font-size:23px;margin:6px 0 4px">Who's using this?</h2>
      <p class="muted" style="margin:0 0 16px;font-size:14.5px">Two names. Each keeps their own progress, streak and mastery record on the same 15-week plan.</p>
      <div class="split" style="margin-bottom:14px">
        <label>Child one<input type="text" id="n1" placeholder="e.g. Aanya" autocomplete="off"></label>
        <label>Child two<input type="text" id="n2" placeholder="e.g. Arjun" autocomplete="off"></label>
      </div>
      <button class="btn" id="save-names">Start the plan</button>
    </div>
  </div>

  <main id="view-today"></main>
  <main id="view-progress" class="hidden"></main>
  <main id="view-plan" class="hidden"></main>
</div>

<script>
"use strict";
/* ============================================================
   Twin Track — a 15-week daily study plan for two 5th graders.
   Grade 5 NJSLS (2023), independent of RSM. 45 min/day, 7 days.
   Progress is keyed to each child's LESSON NUMBER, never the
   calendar, so a missed day never desyncs the two of them.
   ============================================================ */

const START = new Date(2026, 8, 7);   // Mon 7 Sep 2026 — lesson 1
const TOTAL_DAYS = 105;               // 15 weeks x 7

/* ---------- small helpers ---------- */
const $ = (id) => document.getElementById(id);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Deterministic PRNG: the same child on the same lesson always gets the
// same problems, so a refresh mid-session doesn't wipe their work.
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e6) / 1e6; }; }
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
function frac(n, d) { const g = gcd(n, d) || 1; return [n / g, d / g]; }
function fracStr(n, d) { const [a, b] = frac(n, d); return b === 1 ? String(a) : a + "/" + b; }
function mixedStr(n, d) {
  const [a, b] = frac(n, d);
  if (b === 1) return String(a);
  if (a < b) return a + "/" + b;
  const w = Math.floor(a / b), rem = a - w * b;
  return rem === 0 ? String(w) : w + " " + rem + "/" + b;
}
const round2 = (x) => Math.round(x * 100) / 100;

// Accepts 3/4, 1 1/2, 0.75, 1.5 — a child should never lose a mark to format.
function parseAns(s) {
  s = String(s).trim().replace(/\s+/g, " ").replace(/,/g, "");
  if (!s) return null;
  let m = s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if (m) { const w = +m[1], sign = w < 0 ? -1 : 1; return w + sign * (+m[2]) / (+m[3]); }
  m = s.match(/^(-?\d+)\s*\/\s*(\d+)$/);
  if (m) return (+m[1]) / (+m[2]);
  m = s.match(/^-?\d*\.?\d+$/);
  if (m) return parseFloat(s);
  return null;
}
function correct(given, answer) {
  const g = parseAns(given);
  if (g === null) return false;
  const a = typeof answer === "number" ? answer : parseAns(answer);
  return Math.abs(g - a) < 1e-6;
}

/* ============================================================
   CURRICULUM — 15 weeks
   ============================================================ */

const WEEKS = [
  { n:1,  strand:"Place value & decimals",            code:"5.NBT.A.1, A.3",
    obj:"Read, write and compare decimals to thousandths, and explain how each place is 10x the place to its right.",
    ex:"In 4.276 the 7 sits in the hundredths place, so it is worth 0.07. Move one place left and each digit is worth ten times as much; one place right, one tenth as much.",
    gen:"placevalue", sprint:"mult", grammar:{t:"Complete sentences", d:"Every sentence needs a subject and a verb and must express a whole thought. <i>Ran down the hall.</i> is a fragment — it never says who.", items:[["Because the bus was late.","fragment"],["The bus was late.","sentence"],["Waiting at the corner in the rain.","fragment"]]},
    roots:[["tract","pull, drag",["tractor","attract","subtract"]],["spect","look",["inspect","spectator","respect"]],["port","carry",["transport","portable","export"]]],
    read:"pines", focus:"Main idea & key details",
    write:"Write one strong paragraph: what is the single most interesting thing about the Pine Barrens? Topic sentence, two details from the passage, and a closing sentence." },

  { n:2,  strand:"Powers of 10 & rounding",           code:"5.NBT.A.2, A.4",
    obj:"Multiply and divide by powers of 10 and explain the decimal-point shift; round decimals to any place.",
    ex:"3.4 x 10^3 = 3400: the digits move three places left. To round 6.472 to the tenths place, look at the hundredths digit (7), which is 5 or more, so round up to 6.5.",
    gen:"powers", sprint:"mult", grammar:{t:"Run-on sentences", d:"Two complete thoughts cannot be joined by a comma alone. Use a period, a semicolon, or a comma plus <i>and / but / so</i>.", items:[["I finished my homework, I went outside.","run-on"],["I finished my homework, so I went outside.","correct"],["I finished my homework and went outside.","correct"]]},
    roots:[["dict","say, speak",["predict","dictate","contradict"]],["scrib / script","write",["describe","manuscript","subscribe"]],["rupt","break",["interrupt","erupt","rupture"]]],
    read:"lastrow", focus:"Theme",
    write:"What does the story say about being overlooked? State the theme in one sentence, then prove it with two moments from the text." },

  { n:3,  strand:"Multi-digit multiplication",        code:"5.NBT.B.5",
    obj:"Multiply multi-digit whole numbers fluently using the standard algorithm.",
    ex:"For 46 x 27: multiply by 7 (322), then by 20 (920), then add: 1242. Estimate first — 50 x 30 = 1500 — so 1242 is reasonable.",
    gen:"bigmult", sprint:"mult", grammar:{t:"Subject-verb agreement", d:"A singular subject takes a singular verb. Watch for words between them: <i>The box of markers <b>is</b> on the shelf.</i>", items:[["The team of players (is / are) ready.","is"],["My cousins (was / were) late.","were"],["Each of the girls (bring / brings) a snack.","brings"]]},
    roots:[["struct","build",["construct","structure","instruct"]],["form","shape",["transform","uniform","formation"]],["ject","throw",["eject","project","inject"]]],
    read:"canal", focus:"Text structure",
    write:"Explain how a canal lock works, in order, to someone who has never seen one. Use First, Next, Then, Finally." },

  { n:4,  strand:"Division with 2-digit divisors",    code:"5.NBT.B.6",
    obj:"Divide up to four-digit numbers by two-digit divisors, and explain the result with an equation or area model.",
    ex:"For 1548 / 36: estimate 1500 / 36 is about 40. Then 36 x 40 = 1440, leaving 108, and 36 x 3 = 108. So the answer is 43.",
    gen:"bigdiv", sprint:"div", grammar:{t:"Verb tense consistency", d:"Do not switch tense mid-paragraph without a reason. If you start in the past, stay in the past.", items:[["She walked in and sits down.","inconsistent"],["She walked in and sat down.","consistent"],["He runs fast and won the race.","inconsistent"]]},
    roots:[["mit / miss","send",["transmit","mission","dismiss"]],["ped","foot",["pedal","pedestrian","centipede"]],["man","hand",["manual","manufacture","manuscript"]]],
    read:"trade", focus:"Character motivation",
    write:"Why does Dev give up the card? Answer in a paragraph using at least one direct quotation from the story, punctuated correctly." },

  { n:5,  strand:"Adding & subtracting decimals",     code:"5.NBT.B.7",
    obj:"Add and subtract decimals to hundredths and explain the reasoning.",
    ex:"Line up the decimal points, not the last digits: 12.40 + 3.75 = 16.15. Fill empty places with zeros so every column has a digit.",
    gen:"decadd", sprint:"dec", grammar:{t:"Commas in a series", d:"Separate three or more items with commas. Keep the comma before <i>and</i> — it prevents the last two items reading as one.", items:[["We packed sandwiches apples and juice.","We packed sandwiches, apples, and juice."],["She is quick clever and kind.","She is quick, clever, and kind."],["I called Mom Dad and my aunt.","I called Mom, Dad, and my aunt."]]},
    roots:[["aud","hear",["audience","audible","auditorium"]],["vis / vid","see",["visible","video","evidence"]],["voc","voice, call",["vocal","advocate","vocabulary"]]],
    read:"bees", focus:"Inference",
    write:"The passage never says bees are intelligent. Argue that they are, using two pieces of evidence and explaining what each one shows." },

  { n:6,  strand:"Multiplying & dividing decimals",   code:"5.NBT.B.7",

  pines: { kind:"Informational", title:"The Forest in the Middle of Everything",
    src:"About the New Jersey Pine Barrens",
    body:[
      "Drive an hour east of Philadelphia, in the most densely populated state in the country, and the houses simply stop. In their place stands a forest of stunted pines so vast that it covers roughly a fifth of New Jersey. Colonists named it the Pine Barrens, because the sandy soil refused to grow the crops they knew. The name stuck, and it has been misleading people ever since.",
      "The soil is acidic and poor in nutrients, which is exactly why the forest is remarkable. Plants that cannot compete anywhere else thrive here. Curled-leaf pines drop cones that stay sealed until fire cracks them open, so the trees depend on the same wildfires that would destroy another woodland. Carnivorous sundews and pitcher plants trap insects to get the nitrogen the ground will not give them. More than eight hundred plant species grow in the Pine Barrens, and dozens live nowhere else on Earth.",
      "Beneath it all sits the Kirkwood-Cohansey aquifer, which holds an estimated seventeen trillion gallons of some of the purest water in the eastern United States. The sand that made farming so difficult also filters rainwater as it sinks.",

      { q:"The writer ends with \"generous in ways the colonists had not thought to measure.\" What does that sentence mean?", a:"The colonists judged the land only by whether crops grew, missing its water, rare species and ecological value." }

  lastrow: { kind:"Literature", title:"The Last Row", src:"A short story",
    body:[
      "Ravi had played the same eight bars for six weeks. He played them in the morning before school, and again at night with the practice mute jammed into the bell of the trumpet so his sister could sleep. On the night of the winter concert he sat in the last row of the brass section, third trumpet, where the music was mostly long notes and rests.",
      "\"Third trumpet is the glue,\" Mr. Okafor had told him in September. Ravi had decided this was the kind of thing adults said when there was nothing better to say.",
      "The band began. Somewhere in the second piece the first trumpet's entrance did not come. Ravi heard the gap open — a hole where a melody should have been — and understood, in the half-second before it swallowed the room, that he knew the part. He had heard it four hundred times. He lifted his horn and played it.",
      "It was not perfect. He clipped the high note and had to take a breath where there should not have been one. But the piece closed over the gap and moved on, and nobody in the audience knew anything had happened at all.",
      "Afterwards Mr. Okafor found him stacking chairs. He did not say <i>well done</i>. He said, \"You were listening.\" Ravi thought about that on the drive home, and decided it was better."
    ],

      { q:"How does the meaning of that line change by the end?", a:"Ravi actually holds the piece together, so the line turns out to have been literally true." },
      { q:"Why is \"You were listening\" better praise than \"well done\"?", a:"It names the real skill — attention over six weeks — rather than the one lucky moment." }
    ] },

  canal: { kind:"Informational", title:"Stairs for Boats", src:"How canal locks work",
    body:[
      "A canal has a problem that a road does not. Water cannot climb. If a waterway must cross ground that rises forty feet, engineers cannot simply tilt the canal, because the water would run out of the top end. The solution, in use since the 1300s, is to build the canal as a staircase and give each step a room with doors.",
      "That room is a lock. It is a rectangular chamber, usually of stone or concrete, with a watertight gate at each end. A boat travelling uphill enters through the lower gate, which then closes behind it. Valves in the upper gate open, and water from the higher stretch of canal flows in. The boat, floating, rises with the water. When the level inside the chamber matches the level above, the upper gate swings open and the boat continues on the higher stretch.",
      "Going downhill, the sequence reverses and the water drains out. What makes the system elegant is that it needs no pumps at all. Gravity moves every gallon. The only power required is whatever it takes to open the gates, which on older canals was a person with a long wooden beam and a good pair of boots.",
      "A boat on the Erie Canal in 1825 climbed more than five hundred feet this way, one chamber at a time, across eighty-three locks."
    ],
    qs:[
      { q:"What text structure does this passage mainly use, and how can you tell?", a:"Sequence — it describes the steps of the lock process in order, and the final paragraph works through the cycle from entry to exit." },
      { q:"Why can't engineers simply tilt a canal upward?", a:"Water cannot flow uphill; it would run out of the top end." },
      { q:"Explain why locks need no pumps.", a:"Gravity does the work — water flows from the higher stretch into the chamber, or drains out to the lower one." },
      { q:"What does the detail about \"a person with a long wooden beam and a good pair of boots\" add?", a:"It emphasises how little power the system needs, contrasting a huge engineering feat with very simple effort." }
    ] },

  trade: { kind:"Literature", title:"The Trade", src:"A short story",
    body:[
      "The card was worth more than everything else in Dev's binder combined. He knew this because Marcus had told him so at least once a week since September, usually while holding it up to the cafeteria light to show the way the foil caught.",

  bees: { kind:"Informational", title:"The Dance Floor", src:"How honeybees share directions",
    body:[
      "A honeybee that finds a good patch of flowers faces a communication problem. She must tell her hivemates where the food is, in total darkness, to an audience that cannot see her, using no sound they can hear. She solves it by dancing.",
      "Back at the hive she walks a straight line across the vertical honeycomb, waggling her body from side to side, then loops back and repeats it — tracing a shape like a flattened figure eight. Other bees crowd around and read the dance by touch.",
      "The information is encoded in two ways. The duration of the straight run gives the distance: roughly one second of waggling for every kilometre of flight. The angle of the run gives the direction, measured against the sun. A bee that waggles straight up the comb means <i>fly toward the sun</i>. A bee that waggles thirty degrees to the right of vertical means <i>fly thirty degrees right of the sun</i>. Because the comb is vertical and the sun is not, the bee has translated a direction in the sky into an angle on a wall.",
      "She also compensates for time. If she waits twenty minutes before dancing, she adjusts the angle to account for how far the sun has moved. Karl von Frisch worked this out in the 1940s, and was not widely believed for years."
    ],
    qs:[
      { q:"The passage never calls bees intelligent. What evidence suggests they are?", a:"They encode distance and direction symbolically, translate between two frames of reference, and correct for the sun's movement over time." },
      { q:"How does a bee communicate distance?", a:"Through the length of the straight waggling run — about one second per kilometre." },
      { q:"Explain what \"translated a direction in the sky into an angle on a wall\" means.", a:"She converts the real-world angle to the sun into the same angle measured from vertical on the upright comb." },
      { q:"Why might von Frisch not have been believed at first?", a:"The claim that an insect uses an abstract symbolic code, with time correction, seemed too advanced to be credible." }
    ] },

  lowtide: { kind:"Literature", title:"Low Tide", src:"A short story",
    body:[
      "The bay went out a long way at low tide, further than seemed reasonable, leaving a brown plain that steamed faintly in the early sun. Nina walked out onto it in her grandmother's boots, two sizes too big, and the mud made a sound under each step like a question being asked slowly.",
      "There were things out here that belonged to the water and had been caught out. A crab shell, empty and light as paper. A bottle worn to a soft green pebble. The ribs of something wooden that might have been a boat forty years ago and was now mostly an idea of a boat.",
      "Behind her the town was still asleep, its windows blank. Ahead, where the water had gone, gulls stood about in the shallows with the bored patience of people waiting for a bus.",
      "Her grandmother had walked this every morning for sixty-one years and had told Nina, once, that the flat was the only place she knew where you could see what was usually hidden. Nina had been nine and had not understood.",
      "She was fourteen now, and the tide would turn in about two hours, and she stood in the middle of all that revealed ground and thought that she was beginning to."
    ],
    qs:[

      { q:"What has changed for Nina between age nine and fourteen?", a:"She is beginning to understand her grandmother's meaning, having grown enough to read the place the same way." }
    ] },

  molasses: { kind:"Informational", title:"The Great Molasses Flood", src:"Boston, 15 January 1919",
    body:[
      "The tank stood fifty feet high on Commercial Street and held 2.3 million gallons of molasses. It had been built in a hurry in 1915, tested only by filling it with six inches of water, and had leaked so steadily from the start that the company painted it brown to hide the seepage. Local children collected the drips in cans.",
      "On 15 January 1919 the temperature in Boston rose about forty degrees in two days. Warm molasses expands, and fermentation inside the tank produced gas that raised the pressure further. Just after noon, the steel gave way.",
      "A wave of molasses somewhere between fifteen and twenty-five feet high moved down the street at an estimated thirty-five miles per hour. Because molasses is far denser than water — about 1.4 times — the wave carried enormous force. It lifted a railway carriage off its tracks, snapped the girders of an elevated train line, and pushed buildings off their foundations. Twenty-one people were killed and about 150 injured.",
      "The cleanup took months. The legal case took six years, and ended with the company paying damages after a court found the tank had been built without adequate testing. As a direct result, Massachusetts began requiring engineers to sign and seal construction plans — a rule that spread across the country."
    ],
    qs:[

      { q:"Why was the wave so destructive compared with a wave of water?", a:"Molasses is about 1.4 times denser than water, so the same volume carried far more force." },
      { q:"What long-term effect did the disaster have?", a:"Massachusetts required engineers to sign and seal construction plans, and the requirement spread nationally." },
      { q:"What does the detail about painting the tank brown suggest about the company?", a:"It concealed a known defect rather than repairing it — evidence of negligence." }
    ] },

  understudy: { kind:"Literature", title:"The Understudy", src:"A short story",
    body:[
      "Nadia had wanted the part of Viola so badly that when the cast list went up and her name sat beside the word <i>understudy</i>, she read it four times, as though the fourth reading might fix it.",
      "For three weeks she came to every rehearsal and sat in the third row with the script open on her knees, mouthing lines nobody asked her to say. Kayla, who had the part, was good. That was the worst of it. Nadia kept waiting to find something wrong with her and kept failing.",
      "In the second week she stopped watching Kayla's face and started watching her feet. Kayla turned on the line about the shipwreck, and the turn was what made the line land. Nadia wrote <i>turn on shipwreck</i> in the margin. By Friday her margins were full.",
      "She had gone in wanting the part. Somewhere in there she had started wanting the play.",
      "On the Thursday of tech week Kayla's family moved to Ohio, suddenly, the way things happen. Nadia went on. She was not better than Kayla had been. But she knew where every pause lived, because she had spent three weeks writing them down, and the audience leaned forward at the shipwreck.",

      { q:"What do the full margins represent?", a:"The accumulated attention and craft she gained from observing — the real reward of the understudy role." }
    ] },

  glow: { kind:"Informational", title:"Cold Light", src:"Two ways of glowing",
    body:[
      "Most light on Earth is a by-product of heat. A candle flame, a filament bulb, the sun itself — all of them shed light because something is hot. Bioluminescence works differently. It is chemistry, not temperature, and almost none of its energy escapes as heat, which is why biologists call it cold light.",
      "The reaction is broadly the same wherever it appears. A molecule called luciferin combines with oxygen, helped along by an enzyme called luciferase, and the reaction releases a photon. What changes between species is the purpose.",
      "A firefly uses light to be found. Each species has its own flash pattern — a rhythm of pulses and pauses — and males signal into the dark while females answer from the grass. The message is an advertisement, and it must be species-specific, or it fails.",

      "One organism glows to be seen. The other glows so that something else will approach and not understand why."
    ],
    qs:[
      { q:"Give one similarity and one difference between the firefly and the anglerfish.", a:"Both produce light chemically rather than by heat; the firefly signals to attract a mate of its own species, the anglerfish lures prey — and it borrows bacteria rather than producing light itself." },
      { q:"Why is bioluminescence called \"cold light\"?", a:"The chemical reaction releases almost no heat, unlike flames or filaments." },
      { q:"Why must firefly flash patterns be species-specific?", a:"Otherwise the signal would attract the wrong species and fail as an advertisement for mating." },
      { q:"What is the effect of the final sentence's contrast?", a:"It sharpens the comparison into a single memorable opposition: signalling honestly versus deceiving." }
    ] },

  signal: { kind:"Literature", title:"Signal Hill", src:"A short story",
    body:[
      "From where Tomas stood on the hill, the whole valley was a map, and his sister was a small red dot moving across it much too slowly.",
      "He had told her they had until four. He had said it twice, once at the gate and once at the bottom of the meadow, and she had said <i>I know</i> both times in the voice that meant she was not listening. Now the light was going amber and she was still down there crouched over something in the grass.",
      "He cupped his hands and shouted her name. The sound went out over the valley and came back to him thinned and strange, and the red dot did not look up.",
      "It occurred to him, standing there, that from where she was he was probably invisible — a speck against a hill, one shape among the rocks. He had been thinking of himself as the person who could see everything. He had not thought about what he looked like from the bottom.",
      "He started down. It took eleven minutes, and by the time he reached her she was holding a bird's egg, whole and blue and cold, and she said, \"I found this,\" as though she had been waiting the entire time to be able to tell him, and had never once wondered where he was."
    ],
    qs:[

/* ============================================================
   MATH GENERATORS — one per week; each returns {q, a}
   ============================================================ */
const GEN = {
  placevalue(r){
    const t = ri(r,0,2);
    const d = [ri(r,1,9),ri(r,0,9),ri(r,0,9),ri(r,0,9),ri(r,0,9)];
    const num = d[0]+d[1]+"."+d[2]+d[3]+d[4];
    if(t===0){ const places=[["tenths",d[2],.1],["hundredths",d[3],.01],["thousandths",d[4],.001]]; const p=pick(r,places);
      return { q:"In "+num+", what is the value of the digit in the "+p[0]+" place?", a:round2(p[1]*p[2]*1000)/1000 }; }
    if(t===1){
      // Vary BOTH places. With the tens/ones pair fixed the answer is always
      // 10, and they learn to type 10 without reading the question.
      const names=["ones","tens","hundreds","thousands"];
      const b=ri(r,1,9), hi=ri(r,1,3), lo=ri(r,0,hi-1);
      return { q:"A "+b+" in the "+names[hi]+" place is worth how many times a "+b+" in the "+names[lo]+" place?",
               a:Math.pow(10,hi-lo) }; }
    const a1=d[0]+d[1]+"."+d[2]+d[3], a2=d[0]+d[1]+"."+d[2]+ri(r,0,9);
    return { q:"Which is greater, "+a1+" or "+a2+"? Type the greater number.", a:Math.max(parseFloat(a1),parseFloat(a2)) };
  },
  powers(r){
    const t=ri(r,0,2);
    if(t===0){ const b=round2(ri(r,11,99)/10), e=ri(r,1,3);
      return { q:b+" x 10^"+e+" = ?", a:round2(b*Math.pow(10,e)) }; }
    if(t===1){ const b=ri(r,100,9999)/10, e=ri(r,1,2);
      return { q:round2(b)+" / 10^"+e+" = ?", a:round2(b/Math.pow(10,e)*100)/100 }; }
    const n=(ri(r,1,9))+"."+ri(r,0,9)+ri(r,0,9)+ri(r,0,9), place=pick(r,[["tenth",10],["hundredth",100]]);
    return { q:"Round "+n+" to the nearest "+place[0]+".", a:Math.round(parseFloat(n)*place[1])/place[1] };
  },
  bigmult(r){ const a=ri(r,23,89), b=ri(r,14,79); return { q:a+" x "+b+" = ?", a:a*b }; },
  bigdiv(r){ const d=ri(r,12,45), q=ri(r,12,89); return { q:(d*q)+" / "+d+" = ?", a:q }; },
  decadd(r){
    const a=ri(r,120,980)/10, b=ri(r,105,890)/100;
    return r()<.5 ? { q:round2(a)+" + "+round2(b)+" = ?", a:round2(a+b) }
                  : { q:round2(a)+" - "+round2(b)+" = ?", a:round2(a-b) };
  },
  decmul(r){
    if(r()<.5){ const a=ri(r,12,49)/10, b=ri(r,11,29)/10; return { q:round2(a)+" x "+round2(b)+" = ?", a:round2(a*b) }; }
    const q=ri(r,12,48)/10, d=ri(r,2,9); return { q:round2(q*d)+" / "+d+" = ?", a:round2(q) };
  },
  fracadd(r){
    const d1=pick(r,[2,3,4,5,6,8]); let d2=pick(r,[2,3,4,5,6,8,12]); if(d2===d1) d2=d1===12?8:12;
    const n1=ri(r,1,d1-1), n2=ri(r,1,d2-1);
    if(r()<.5) return { q:n1+"/"+d1+" + "+n2+"/"+d2+" =  (lowest terms)", a:n1/d1+n2/d2 };
    const A=n1/d1, B=n2/d2;
    return A>=B ? { q:n1+"/"+d1+" - "+n2+"/"+d2+" =  (lowest terms)", a:A-B }
                : { q:n2+"/"+d2+" - "+n1+"/"+d1+" =  (lowest terms)", a:B-A };
  },
  fracword(r){
    const d1=pick(r,[3,4,5,6,8]), d2=pick(r,[3,4,5,6,8]);
    const n1=ri(r,1,d1-1), n2=ri(r,1,d2-1);
    const who=pick(r,["Reading","Practice","The walk","The recipe","The project"]);
    return { q:who+" took "+fracStr(n1,d1)+" of an hour on Monday and "+fracStr(n2,d2)+" of an hour on Tuesday. How much in total? (lowest terms)", a:n1/d1+n2/d2 };
  },
  fracdiv(r){
    if(r()<.5){ const a=ri(r,2,9), b=ri(r,2,9); return { q:a+" sandwiches shared equally by "+b+" people. How much each? (fraction, lowest terms)", a:a/b }; }
    const d=pick(r,[3,4,5,6,8]), n=ri(r,1,d-1), w=d*ri(r,2,5);
    return { q:fracStr(n,d)+" x "+w+" = ?", a:n/d*w };
  },
  fracmul(r){
    const d1=pick(r,[2,3,4,5,6]), d2=pick(r,[2,3,4,5,8]);
    const n1=ri(r,1,d1-1), n2=ri(r,1,d2-1);
    if(r()<.5) return { q:n1+"/"+d1+" x "+n2+"/"+d2+" =  (lowest terms)", a:(n1*n2)/(d1*d2) };
    return { q:"A rectangle is "+fracStr(n1,d1)+" m by "+fracStr(n2,d2)+" m. What is its area in square metres? (lowest terms)", a:(n1*n2)/(d1*d2) };
  },
  scaling(r){
    const w=ri(r,12,60), d=pick(r,[3,4,5,8]), n=pick(r,[1,2,3,5,7]);
    const f=n/d, bigger=f>1;
    return { q:"Without multiplying: is "+w+" x "+n+"/"+d+" greater or less than "+w+"? Type 1 for greater, 0 for less.", a:bigger?1:0 };
  },
  unitdiv(r){
    if(r()<.5){ const w=ri(r,2,9), d=pick(r,[2,3,4,5,6,8]); return { q:w+" / (1/"+d+") = ?", a:w*d }; }
    const d=pick(r,[2,3,4,5]), w=ri(r,2,7); return { q:"(1/"+d+") / "+w+" =  (fraction)", a:1/(d*w) };
  },
  expr(r){
    const t=ri(r,0,2);
    if(t===0){ const a=ri(r,2,9), b=ri(r,3,15), c=ri(r,2,12); return { q:a+" x ("+b+" + "+c+") = ?", a:a*(b+c) }; }
    if(t===1){ const a=ri(r,20,80), b=ri(r,2,9), c=ri(r,2,9); return { q:a+" - ("+b+" x "+c+") = ?", a:a-b*c }; }
    const a=ri(r,2,6), b=ri(r,2,6), c=ri(r,2,9), d=ri(r,1,8);
    return { q:"["+a+" x ("+b+" + "+c+")] - "+d+" = ?", a:a*(b+c)-d };
  },
  coord(r){
    const t=ri(r,0,1), s=ri(r,2,6), st=ri(r,0,4);
    if(t===0){ const k=ri(r,3,6); return { q:"Rule: start at "+st+", add "+s+" each time. What is term "+k+"? (the start is term 1)", a:st+s*(k-1) }; }
    const x=ri(r,1,9), y=ri(r,1,9);
    return { q:"Point P is at ("+x+", "+y+"). Move 3 right and 2 up. What is the new x-coordinate?", a:x+3 };
  },
  volume(r){
    const t=ri(r,0,2);
    if(t===0){ const a=ri(r,2,9), b=ri(r,2,9), c=ri(r,2,9); return { q:"A prism is "+a+" by "+b+" by "+c+" cm. Volume in cubic cm?", a:a*b*c }; }
    if(t===1){ const cm=ri(r,120,940); return { q:"Convert "+cm+" cm to metres.", a:round2(cm/100) }; }
    const g=ri(r,2,9)*500; return { q:"Convert "+g+" g to kilograms.", a:round2(g/1000) };
  }
};

/* ---------- backup ----------
   Browser storage is not permanent: clearing Safari data, or iOS reclaiming
   space from an unused site, takes it with it. One tap writes a file the
   family can keep, and the same file restores it. */
function exportProgress(){
  const blob = new Blob([JSON.stringify({app:"twintrack",v:1,exported:new Date().toISOString(),cfg,prog},null,2)],
    {type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="twin-track-progress-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function importProgress(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      if(d.app!=="twintrack") throw new Error("not a Twin Track backup");
      if(d.cfg) cfg=d.cfg;
      if(d.prog) prog=d.prog;
      saveAll(); render();
      alert("Restored. "+cfg.names[0]+" is on lesson "+prog.c0.lesson+", "+cfg.names[1]+" on lesson "+prog.c1.lesson+".");
    }catch(e){ alert("That file could not be read: "+e.message); }
  };
  fr.readAsText(file);
}

function renderBlock(b,i,n,wk){
  const key="blk"+i;
  const wrapEl=el("div","block"+(answered[key]?" done":"")+(i===firstOpen()?" active":""));
  wrapEl.dataset.i=i;
  const btn=el("button","block-btn");
  btn.innerHTML='<span class="bnum">'+(answered[key]?"&#10003;":(i+1))+'</span>'+
    '<span class="btitle">'+esc(b.t)+'<small>'+esc(b.s)+'</small></span>'+
    '<span class="pill '+b.strand+'">'+(b.strand==="math"?"Math":"English")+'</span>'+
    '<span class="bmin">'+b.m+' min</span>';
  btn.onclick=()=>{ document.querySelectorAll(".block").forEach(x=>x.classList.remove("active")); wrapEl.classList.add("active"); };
  wrapEl.appendChild(btn);
  const body=el("div","body");
  BUILD[b.k](body,{n,wk,key,block:b});

}
function firstOpen(){ let i=0; while(answered["blk"+i]) i++; return i; }

function markDone(key,el2){
  answered[key]=true;
  const blk=el2.closest(".block");
  if(blk){ blk.classList.add("done"); blk.querySelector(".bnum").innerHTML="&#10003;"; }
}

/* ---------- question list helper ---------- */
function qlist(host,{key,items,onDone,label}){
  const box=el("div");
  items.forEach((it,i)=>{
    const row=el("div","q");
    row.innerHTML='<span class="qn">'+(i+1)+'</span><span class="qtext"><span class="qmath">'+esc(it.q)+'</span></span>';
    const inp=el("input"); inp.type="text"; inp.setAttribute("aria-label","Answer "+(i+1));
    const mk=el("span","mark");
    inp.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ const nx=box.querySelectorAll("input")[i+1]; if(nx) nx.focus(); else check(); }});
    row.appendChild(inp); row.appendChild(mk);
    box.appendChild(row);
  });
  host.appendChild(box);
  const res=el("div","result");
  const bar=el("div","row"); bar.style.marginTop="12px";
  const cb=el("button","btn sm",label||"Check answers");
  const sb=el("button","btn sm ghost","Show answers");
  bar.appendChild(cb); bar.appendChild(sb);
  host.appendChild(bar); host.appendChild(res);

  function check(){
    const ins=box.querySelectorAll("input"); let got=0;
    ins.forEach((inp,i)=>{
      const ok=correct(inp.value,items[i].a);
      inp.classList.toggle("ok",ok); inp.classList.toggle("no",!ok&&inp.value.trim()!=="");
      const mk=inp.nextSibling; mk.textContent = ok?"✓":(inp.value.trim()?"✗":"");
      mk.style.color = ok?"var(--good)":"var(--warn)";
      if(ok) got++;
    });
    const pct=Math.round(got/items.length*100);
    res.className="result show "+(pct>=80?"pass":"part");
    res.textContent = got+" of "+items.length+" correct ("+pct+"%). "+
      (pct>=80?"That is mastery — move on.":"Fix the ones marked with a cross, then check again.");
    if(onDone) onDone(got,items.length,cb);
    return got;
  }
  cb.onclick=check;
  sb.onclick=()=>{ const ins=box.querySelectorAll("input");
    ins.forEach((inp,i)=>{ const a=items[i].a;
      inp.value = typeof a==="number" ? (Number.isInteger(a)?a:round2(a)) : a; inp.classList.remove("no"); });
    res.className="result show part"; res.textContent="Answers filled in. Work back through any you did not get — that is where the learning is.";
  };
  return {check};
}

const BUILD = {
  sprint(host,{n,wk,key}){
    const sp=SPRINT[wk.sprint], r=rng(seedFor(n,"sprint"));

    const t=el("div","timer");
    t.innerHTML='<span class="tval mono">0:00</span><span class="ttarget">Target for 20 problems: <b class="mono">'+
      Math.floor(sp.target/60)+':'+String(sp.target%60).padStart(2,"0")+'</b><br><span class="muted">'+esc(sp.label)+'</span></span>';
    const go=el("button","btn sm","Start");
    t.appendChild(go); host.appendChild(t);
    let iv=null, sec=0;
    go.onclick=()=>{ if(iv){ clearInterval(iv); iv=null; go.textContent="Start"; return; }
      go.textContent="Stop"; iv=setInterval(()=>{ sec++;
        t.querySelector(".tval").textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
        t.querySelector(".tval").style.color = sec>sp.target ? "var(--warn)":"var(--ink)";
      },1000); };
    qlist(host,{key,items,label:"Check sprint",onDone:(g,tot)=>{ if(iv){clearInterval(iv);iv=null;go.textContent="Start";}
      logBlock(n,"sprint",{score:g,of:tot,sec}); markDone(key,host); }});
  },

  mathnew(host,{n,wk,key}){
    host.appendChild(el("div","example",'<h4>Worked example</h4><p>'+wk.ex+'</p>'));
    const r=rng(seedFor(n,"mathnew")), g=GEN[wk.gen], items=[];

    qlist(host,{key,items,onDone:(gt,tot)=>{ logBlock(n,"math",{score:gt,of:tot}); markDone(key,host); }});
  },

  spiral(host,{n,wk,key}){
    const w=weekOf(n), items=[], r=rng(seedFor(n,"spiral"));
    // Spacing + interleaving: pull from every earlier week, weighted to the recent.
    const pool=[]; for(let i=1;i<w;i++) pool.push(i);
    if(!pool.length){
      host.appendChild(el("p","muted","Week 1 has nothing behind it yet. Take four more from this week instead — the spiral starts on Monday."));
      const g=GEN[wk.gen]; for(let i=0;i<4;i++) items.push(g(r));
    } else {
      host.appendChild(el("p","muted","Four problems from weeks you have already finished. Spacing them out is what moves them into long-term memory."));
      for(let i=0;i<4;i++){ const pw=pool[Math.floor(r()*pool.length)]; const gw=WEEKS[pw-1];
        const it=GEN[gw.gen](r); it.q="(Wk "+pw+") "+it.q; items.push(it); }
    }
    qlist(host,{key,items,onDone:(gt,tot)=>{ logBlock(n,"spiral",{score:gt,of:tot}); markDone(key,host); }});

  reading(host,{n,wk,key}){

  roots(host,{n,wk,key}){
    const box=el("div","roots");

      box.appendChild(el("div","root",'<b>'+esc(rt)+'</b><span class="mean">'+esc(mean)+'</span>'+

      sh.onclick=()=>{ ans.innerHTML='<b>'+esc(it[1])+'</b>'; };
      d.appendChild(inp); d.appendChild(el("div","",""));

    b.onclick=()=>{ logBlock(n,"grammar",{done:true}); markDone(key,b); };
    host.appendChild(b);

  writing(host,{n,wk,key}){
    host.appendChild(el("div","example eng",'<h4>This week’s piece</h4><p>'+esc(wk.write)+'</p>'));
    host.appendChild(el("p","muted","Plan for five minutes before you write. Draft for fifteen. Spend the last five reading it aloud and fixing what your ear catches."));
    ["Plan — what am I arguing, and what evidence?","Draft","What I changed when I read it aloud"].forEach((lab)=>{
      const d=el("div"); d.style.margin="12px 0";
      d.innerHTML='<div class="eyebrow" style="margin-bottom:5px">'+esc(lab)+'</div>';
      const ta=el("textarea"); if(lab==="Draft") ta.style.minHeight="180px";
      d.appendChild(ta); host.appendChild(d);
    });
    const b=el("button","btn sm","Mark writing done");
    b.onclick=()=>{ logBlock(n,"writing",{done:true}); markDone(key,b); };
    host.appendChild(b);
  },

  check(host,{n,wk,key}){
    const r=rng(seedFor(n,"check")), items=[], w=weekOf(n);
    for(let i=0;i<6;i++) items.push(GEN[wk.gen](r));

    qlist(host,{key,items,label:"Score the check",onDone:(g,tot)=>{ logBlock(n,"check",{score:g,of:tot}); markDone(key,host); }});

function logBlock(n,kind,data){
  const c=ck(); const k="L"+n;
  prog[c].log[k]=prog[c].log[k]||{};
  prog[c].log[k][kind]=data;
  saveAll();
}

function completeDay(n){
  const c=ck(), today=new Date().toISOString().slice(0,10);
  if(prog[c].last!==today){ prog[c].streak=(prog[c].streak||0)+1; prog[c].last=today; }
  prog[c].lesson=Math.min(TOTAL_DAYS,n+1);
  Object.keys(answered).forEach(k=>delete answered[k]);
  saveAll(); render(); window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- progress ---------- */
function renderProgress(){
  const root=$("view-progress"); root.innerHTML="";
  root.appendChild(el("div","dayhead",'<div class="eyebrow">Progress</div><h1>'+esc(cfg.names[who])+'</h1>'+
    '<p class="muted" style="margin:0">Mastery is scored from the Sunday check and the daily math block. Under 80% means repeat, not advance.</p>'));

  const c=ck(), n=lessonOf(c), log=prog[c].log||{};
  const scores=[], sprints=[];
  Object.keys(log).forEach(k=>{ const L=log[k];
    if(L.math&&L.math.of) scores.push({L:+k.slice(1),pct:L.math.score/L.math.of});
    if(L.sprint&&L.sprint.sec) sprints.push({L:+k.slice(1),sec:L.sprint.sec, score:L.sprint.score});
  });
  scores.sort((a,b)=>a.L-b.L); sprints.sort((a,b)=>a.L-b.L);

  const cards=el("div","split"); cards.style.marginTop="18px";
  const avg = scores.length ? Math.round(scores.reduce((s,x)=>s+x.pct,0)/scores.length*100) : null;

    '<div class="mono" style="font-size:31px;font-weight:600;margin:4px 0">'+(avg===null?"&mdash;":avg+"%")+'</div>'+
    '<div class="muted" style="font-size:13.5px">'+(scores.length? "across "+scores.length+" sessions" : "no sessions logged yet")+'</div>'));
  const last=sprints.length?sprints[sprints.length-1]:null;

    '<div class="muted" style="font-size:13.5px">'+(last? last.score+"/20 correct" : "no sprint timed yet")+'</div>'));

    const a=sc.length?Math.round(sc.reduce((s,x)=>s+x,0)/sc.length*100):null;

  rst.onclick=()=>{ if(confirm("Reset "+cfg.names[who]+"'s progress? Their log and streak are cleared."))
    { prog[ck()]={lesson:1,streak:0,last:"",log:{}}; saveAll(); render(); } };
  root.appendChild(rst);
}

/* ---------- plan ---------- */
function planPreview(){
  const d=el("div");
  d.appendChild(el("div","dayhead",'<div class="eyebrow">September 7 &ndash; December 20, 2026</div>'+
    '<h1>Fifteen weeks, 45 minutes a day</h1>'+
    '<p class="muted" style="margin:0;max-width:62ch">A full Grade 5 New Jersey math sequence plus daily reading, vocabulary, grammar and writing. Add two names above to begin.</p>'));
  d.appendChild(planBody());
  return d;
}
function renderPlan(){
  const root=$("view-plan"); root.innerHTML="";
  root.appendChild(el("div","dayhead",'<div class="eyebrow">September 7 &ndash; December 20, 2026</div>'+
    '<h1>The plan</h1><p class="muted" style="margin:0;max-width:62ch">105 lessons. Math follows the NJ Grade 5 standards end to end; English runs reading, roots, grammar and writing in parallel every day.</p>'));
  root.appendChild(planBody());
}
function planBody(){
  const d=el("div");
  const shape=el("div","card"); shape.style.margin="20px 0";
  shape.innerHTML='<div class="eyebrow" style="margin-bottom:10px">Where the 45 minutes goes</div>'+
    '<div class="tablewrap"><table><thead><tr><th>Day</th><th>Shape</th><th>Math</th><th>English</th></tr></thead><tbody>'+
    '<tr><td>Mon&ndash;Fri</td><td>Six blocks</td><td class="num">25 min</td><td class="num">20 min</td></tr>'+
    '<tr><td>Saturday</td><td>Writing studio</td><td class="num">15 min</td><td class="num">30 min</td></tr>'+
    '<tr><td>Sunday</td><td>Consolidation &mdash; no new material</td><td class="num">25 min</td><td class="num">20 min</td></tr>'+
    '</tbody></table></div>'+
    '<p class="muted" style="font-size:13.5px;margin:11px 0 0">Sunday deliberately introduces nothing new. Seven days of new content is how a plan dies in November.</p>';
  d.appendChild(shape);

  const h=el("h2"); h.style.cssText="font-size:19px;margin:22px 0 10px"; h.textContent="Week by week";
  d.appendChild(h);
  const tw=el("div","tablewrap");
  let rows='<table><thead><tr><th>Wk</th><th>Math focus</th><th>Standard</th><th>Reading focus</th><th>Roots</th></tr></thead><tbody>';
  WEEKS.forEach(w=>{
    rows+='<tr><td class="num">'+w.n+'</td><td><b>'+esc(w.strand)+'</b></td><td class="num" style="font-size:12.5px">'+esc(w.code)+
      '</td><td>'+esc(w.focus)+'</td><td class="mono" style="font-size:12.5px">'+w.roots.map(x=>esc(x[0])).join(", ")+'</td></tr>';
  });
  rows+='</tbody></table>';
  tw.innerHTML=rows; d.appendChild(tw);

  d.appendChild(el("p","note","Built on the 2023 New Jersey Student Learning Standards for Grade 5. The daily fluency sprint borrows Kumon's timed-completion standard; the spiral review and the root retrieval apply spaced practice and retrieval, which outperform re-reading by a wide margin in classroom studies."));
  return d;
}

/* ---------- wiring ---------- */
document.querySelectorAll(".nav").forEach(b=>{ b.onclick=()=>{ view=b.dataset.view; render(); window.scrollTo({top:0}); }; });
$("save-names").onclick=()=>{
  const a=$("n1").value.trim(), b=$("n2").value.trim();
  if(!a||!b){ alert("Both names, please — each child keeps their own record."); return; }
  cfg.names=[a,b]; cfg.setup=true; saveAll(); render();
};
boot();
</script>
